server {
    listen 8080;
    server_name _;
    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

geo $remote_addr $is_banned {
    default 0;
    include /etc/nginx/dynamic/banned_ips.conf;
}

# Rate limiting zone: allows 20 req/sec per IP, with a burst of 100
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_status 429;

server {
    listen 8443 ssl;
    server_name _;
    root /var/www/html;
    index index.html;

    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Prevent Nginx from appending the internal 8443 port to 302 redirects
    absolute_redirect off;

    # Limit payload size to 5MB to prevent DoS via large uploads/JSON bodies
    client_max_body_size 5M;

    location / {
        if ($is_banned) {
            return 403;
        }

        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        if ($is_banned) {
            return 403;
        }
        limit_req zone=api_limit burst=100 nodelay;
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
