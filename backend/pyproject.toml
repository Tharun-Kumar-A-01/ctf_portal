[project]
name = "ctf-backend"
version = "0.1.0"
description = "Flask Backend with Encrypted SQLite, JWT, Leaderboards, and Excel/CSV parsing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=44.0.1",
    "flask-cors>=6.0.0",
    "flask-jwt-extended>=4.7.1",
    "flask-limiter>=4.1.1",
    "flask-sock>=0.6.0",
    "flask-sqlalchemy>=3.1.1",
    "flask>=3.1.0",
    "openpyxl>=3.1.5",
    "pyjwt>=2.10.1",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.0.1",
    "werkzeug>=3.1.3",
    "gunicorn>=21.2.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-benchmark>=4.0.0",
    "vulture>=2.16",
]
